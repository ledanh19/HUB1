version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 18
  - Vite
  - Tailwind CSS
  - shadcn/ui (Radix UI)
  - Supabase (PostgreSQL + Auth + Realtime + Edge Functions)
  - React Query (TanStack)
  - Zustand
  - React Router DOM v6
  - React Hook Form + Zod
  - Recharts
  - date-fns
routes:
  - path: /auth
    file: src/pages/AuthPage.tsx
    auth_required: false
    description: Login page with email/password authentication
  - path: /
    file: src/pages/Dashboard.tsx
    auth_required: true
    description: Main dashboard with KPIs, charts, live feed
  - path: /stays
    file: src/pages/StaysPage.tsx
    auth_required: true
    description: Stays management with check-in/check-out operations
  - path: /bookings
    file: src/pages/BookingsPage.tsx
    auth_required: true
    description: Booking list with search, filter, and CRUD
  - path: /bookings/:id
    file: src/pages/BookingDetailPage.tsx
    auth_required: true
    description: Booking detail with room lines, payments, guests
  - path: /customers
    file: src/pages/CustomersPage.tsx
    auth_required: true
    description: Customer/guest management
  - path: /partners
    file: src/pages/PartnersPage.tsx
    auth_required: true
    description: Host/partner management
  - path: /services
    file: src/pages/ServiceOrdersPage.tsx
    auth_required: true
    description: Service orders management
  - path: /ota-messages
    file: src/pages/OtaMessagesPage.tsx
    auth_required: true
    description: OTA messaging with real-time chat
  - path: /ota-payouts
    file: src/pages/OtaPayoutsPage.tsx
    auth_required: true
    description: OTA payout reconciliation
  - path: /disputes
    file: src/pages/DisputesPage.tsx
    auth_required: true
    description: OTA dispute tracking
  - path: /host-deposits
    file: src/pages/HostDepositsPage.tsx
    auth_required: true
    description: Host deposit management
  - path: /host-payables
    file: src/pages/HostPayablesPage.tsx
    auth_required: true
    description: Host payables tracking
  - path: /host-payables/settlement
    file: src/pages/HostSettlementPage.tsx
    auth_required: true
    description: Host settlement processing
  - path: /payments/requests
    file: src/pages/PaymentRequestsPage.tsx
    auth_required: true
    description: Payment request workflow
  - path: /collections
    file: src/pages/CollectionsPage.tsx
    auth_required: true
    description: Hotel collection tracking
  - path: /payments/cashout
    file: src/pages/CashOutPage.tsx
    auth_required: true
    description: Cash out processing
  - path: /reports/pnl
    file: src/pages/ReportsPnlPage.tsx
    auth_required: true
    description: Profit and Loss report
  - path: /reports/cashflow
    file: src/pages/ReportsCashflowPage.tsx
    auth_required: true
    description: Cashflow report
  - path: /channel-manager/inventory
    file: src/pages/InventoryPage.tsx
    auth_required: true
    description: Channel manager inventory grid
  - path: /ai-pricing/insights
    file: src/pages/AIPricingInsightsPage.tsx
    auth_required: true
    description: AI smart pricing insights
  - path: /settings
    file: src/pages/SettingsPage.tsx
    auth_required: true
    description: System settings and configuration
  - path: /audit-logs
    file: src/pages/AuditLogsPage.tsx
    auth_required: true
    description: Audit trail viewer
features:
  - name: User Authentication
    description: Login with email and password via Supabase Auth
    files:
      - src/pages/AuthPage.tsx
      - src/hooks/useAuth.tsx
    entry_route: /auth
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click login button to submit
      - See error message on invalid credentials
      - Redirected to dashboard on successful login
    api_calls:
      - method: POST
        endpoint: supabase.auth.signInWithPassword
    auth_required: false
  - name: Dashboard
    description: Overview dashboard with KPIs, booking stats, revenue charts, live feed events
    files:
      - src/pages/Dashboard.tsx
      - src/components/dashboard/LiveFeedEvents.tsx
      - src/components/ai-dashboard/AIBrief.tsx
      - src/hooks/useDashboardData.ts
      - src/hooks/useBookings.ts
    entry_route: /
    user_interactions:
      - View revenue KPIs
      - View booking statistics
      - See live feed of booking changes
      - Interact with date range filters
      - View charts and graphs
    api_calls:
      - method: GET
        endpoint: supabase.from('unified_bookings').select
      - method: GET
        endpoint: supabase.from('booking_changes').select
    auth_required: true
  - name: Stays Management
    description: Manage active stays with check-in, check-out, extend stay operations
    files:
      - src/pages/StaysPage.tsx
      - src/hooks/useStays.ts
      - src/hooks/useMultiRoomCheckInOut.ts
    entry_route: /stays
    user_interactions:
      - View active stays list
      - Filter by status and date
      - Perform check-in operation
      - Perform check-out operation
      - View stay details
    api_calls:
      - method: GET
        endpoint: supabase.from('stays').select
      - method: PATCH
        endpoint: supabase.from('stays').update
    auth_required: true
  - name: Booking Management
    description: Full CRUD for bookings with search, filter, and detailed view
    files:
      - src/pages/BookingsPage.tsx
      - src/pages/BookingDetailPage.tsx
      - src/hooks/useBookings.ts
      - src/components/booking/
    entry_route: /bookings
    user_interactions:
      - View booking list with search
      - Filter by status, date, property
      - Click on booking to view details
      - Edit booking information
      - View room lines and charges
      - Manage guest information
    api_calls:
      - method: GET
        endpoint: supabase.from('unified_bookings').select
      - method: GET
        endpoint: supabase.from('booking_room_lines_mirror').select
    auth_required: true
  - name: OTA Messages
    description: Real-time OTA messaging system with conversation threads
    files:
      - src/pages/OtaMessagesPage.tsx
      - src/hooks/useConversations.ts
      - src/components/messages/
    entry_route: /ota-messages
    user_interactions:
      - View conversation list
      - Select conversation to read messages
      - Send reply message
      - Search conversations
    api_calls:
      - method: GET
        endpoint: supabase.from('conversations').select
      - method: POST
        endpoint: supabase.functions.invoke('channex-send-message')
    auth_required: true
  - name: Channel Manager Inventory
    description: Grid-based inventory management for room types and rate plans
    files:
      - src/pages/InventoryPage.tsx
      - src/hooks/useInventory.ts
      - src/components/inventory/
    entry_route: /channel-manager/inventory
    user_interactions:
      - View inventory grid by date range
      - Select cells for bulk update
      - Update rates, availability, restrictions
      - View sync status
    api_calls:
      - method: GET
        endpoint: supabase.functions.invoke('inventory-grid')
      - method: POST
        endpoint: supabase.functions.invoke('inventory-batch-update')
    auth_required: true
known_limitations:
  - issue: Race condition in cash_outs - check-then-act pattern allows overpayment
    location: src/hooks/useCashOuts.ts
    impact: Two simultaneous cash outs could exceed the approved payment amount
  - issue: Double realtime events for booking_changes
    location: src/hooks/useRealtimeSystem.ts, src/components/dashboard/LiveFeedEvents.tsx
    impact: UI may show duplicate notifications
  - issue: Settlement operations not wrapped in database transaction
    location: src/hooks/useHostSettlement.ts
    impact: Partial settlement could create orphan records
  - issue: Cancelled bookings do not reverse revenue entries
    location: Revenue entry system
    impact: P&L reports may be inaccurate after cancellations
